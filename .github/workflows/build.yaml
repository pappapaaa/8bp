name: Build unsigned injected IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcode-select -p
          xcodebuild -version

      - name: Build dylib
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ./build_dylib.sh ]]; then BUILD_SCRIPT=./build_dylib.sh
          elif [[ -f ./build_module.sh ]]; then BUILD_SCRIPT=./build_module.sh
          else echo 'Neither dylib build script exists.' >&2; exit 1; fi
          chmod +x "$BUILD_SCRIPT"
          "$BUILD_SCRIPT"
          DYLIB_PATH="$(find "$GITHUB_WORKSPACE" -type f -name 'libKAKUMod.dylib' -print -quit)"
          test -n "$DYLIB_PATH" || { echo 'No libKAKUMod.dylib was produced.' >&2; exit 1; }
          echo "DYLIB_PATH=$DYLIB_PATH" >> "$GITHUB_ENV"

      - name: Install optool
        shell: bash
        run: |
          set -euo pipefail
          TOOL_DIR="$RUNNER_TEMP/optool"
          SOURCE_DIR="$TOOL_DIR/source"
          BIN_DIR="$TOOL_DIR/bin"
          ARGUMENT_PARSER_DIR="$SOURCE_DIR/optool/FSArgumentParser/ArgumentParser"

          git clone --depth 1 --recurse-submodules \
            https://github.com/alexzielenski/optool.git \
            "$SOURCE_DIR"
          mkdir -p "$BIN_DIR"

          # Homebrew no longer ships optool, and the 0.1 release binary is
          # x86_64-only. Compile a native host binary with Xcode's macOS clang.
          ARGUMENT_PARSER_SOURCES=("$ARGUMENT_PARSER_DIR"/*.m)
          test -f "${ARGUMENT_PARSER_SOURCES[0]}"

          xcrun --sdk macosx clang \
            -fobjc-arc \
            -fobjc-exceptions \
            -O2 \
            -framework Foundation \
            -I"$SOURCE_DIR/optool" \
            -I"$ARGUMENT_PARSER_DIR" \
            "$SOURCE_DIR/optool/main.m" \
            "$SOURCE_DIR/optool/headers.m" \
            "$SOURCE_DIR/optool/NSData+Reading.m" \
            "$SOURCE_DIR/optool/operations.m" \
            "${ARGUMENT_PARSER_SOURCES[@]}" \
            -o "$BIN_DIR/optool"

          chmod +x "$BIN_DIR/optool"
          "$BIN_DIR/optool" --help >/dev/null
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          echo "OPTOOL_PATH=$BIN_DIR/optool" >> "$GITHUB_ENV"

      - name: Extract IPA and locate executable
        shell: bash
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/input.ipa"
          WORK_DIR="$RUNNER_TEMP/ipa-work"
          rm -rf "$WORK_DIR" && mkdir -p "$WORK_DIR"
          unzip -q "$GITHUB_WORKSPACE/input.ipa" -d "$WORK_DIR"
          APP_PATH="$(find "$WORK_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          EXECUTABLE_PATH="$APP_PATH/$EXECUTABLE_NAME"
          test -f "$EXECUTABLE_PATH"
          echo "WORK_DIR=$WORK_DIR" >> "$GITHUB_ENV"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "EXECUTABLE_PATH=$EXECUTABLE_PATH" >> "$GITHUB_ENV"

      - name: Inject dylib with optool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$APP_PATH/Frameworks"
          cp "$DYLIB_PATH" "$APP_PATH/Frameworks/libKAKUMod.dylib"
          chmod 755 "$EXECUTABLE_PATH" "$APP_PATH/Frameworks/libKAKUMod.dylib"
          # Changing the executable invalidates its old signature; remove only.
          codesign --remove-signature "$EXECUTABLE_PATH" || true
          codesign --remove-signature "$APP_PATH/Frameworks/libKAKUMod.dylib" || true
          "$OPTOOL_PATH" install -c load -p '@executable_path/Frameworks/libKAKUMod.dylib' -t "$EXECUTABLE_PATH"

      - name: Repackage unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$GITHUB_WORKSPACE/debug_output.ipa"
          (cd "$WORK_DIR" && zip -qry "$GITHUB_WORKSPACE/debug_output.ipa" Payload)
          unzip -tq "$GITHUB_WORKSPACE/debug_output.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: debug-output-ipa
          path: debug_output.ipa
          if-no-files-found: error
          retention-days: 14
