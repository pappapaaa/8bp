name: Build iOS Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest   # macOS runner with Xcode and iOS SDK

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Make build script executable
        run: chmod +x build_dylib.sh

      - name: Build dylib
        run: ./build_dylib.sh

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: libKAKUMod
          path: libKAKUMod.dylib
